[pytest]
# Device tests (marker `tt`) are deselected by default so host test runs can never open a device.
# They run only via:  scripts/tt_run.sh -- python -m pytest -m tt ...   (the later -m wins over addopts)
addopts = -m "not tt"
markers =
    tt: test opens Tenstorrent devices; run ONLY through scripts/tt_run.sh
