name: Lint

# CI is switched off in this fork (owner request, 2026-11-11: the upstream workflows only produced failure e-mails).
# Run it by hand from the Actions tab if needed; to switch it back on restore the `push` / `pull_request` triggers of upstream.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: pre-commit/action@v3.0.1
